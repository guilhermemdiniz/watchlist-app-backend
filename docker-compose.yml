services:
  backend:
    build: .
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules # Impede que o volume local sobrescreva os modulos do container
    environment:
      - PORT=3333
      - MONGO_URI=mongodb://db:27017/watchlist
      - JWT_SECRET=super_secret_key_change_in_production
    depends_on:
      - db

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: